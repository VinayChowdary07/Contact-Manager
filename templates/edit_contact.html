


{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h2 class="my-4 text-center">Edit Contact</h2>

    <!-- Edit Contact Form -->
    <form method="POST">
        <div class="row mb-3">
            <div class="col-md-6">
                <label for="name" class="form-label">Name</label>
                <input type="text" name="name" id="name" class="form-control" value="{{ contact.name }}" required>
            </div>
            <div class="col-md-6">
                <label for="phone" class="form-label">Phone</label>
                <input type="text" name="phone" id="phone" class="form-control" value="{{ contact.phone }}" required>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-6">
                <label for="email" class="form-label">Email</label>
                <input type="email" name="email" id="email" class="form-control" value="{{ contact.email }}" required>
            </div>
            <div class="col-md-6">
                <label for="location" class="form-label">Location</label>
                <input type="text" name="location" id="location" class="form-control" value="{{ contact.location }}" required>
            </div>
        </div>

        <button type="submit" class="btn btn-primary w-100">Update Contact</button>
    </form>
</div>
{% endblock %}
